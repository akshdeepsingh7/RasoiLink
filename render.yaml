services:
  - type: web
    name: rasoilink
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn_conf.py main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
